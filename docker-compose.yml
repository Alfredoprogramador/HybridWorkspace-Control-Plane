version: '3.9'

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: hwcp-postgres
    environment:
      POSTGRES_DB: hwcp
      POSTGRES_USER: hwcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hwcp_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hwcp -d hwcp"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hwcp-net

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hwcp-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-hwcp_redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-hwcp_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hwcp-net

  # ── Backend (FastAPI) ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: hwcp-backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://hwcp:${POSTGRES_PASSWORD:-hwcp_dev_password}@postgres:5432/hwcp
      - REDIS_URL=redis://:${REDIS_PASSWORD:-hwcp_redis_dev}@redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - OPA_URL=http://opa:8181
      - HEADSCALE_URL=http://headscale:8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/backend:/app
    networks:
      - hwcp-net
    restart: unless-stopped

  # ── Frontend (Next.js) ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: hwcp-frontend
    environment:
      - BACKEND_URL=http://backend:8000
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - hwcp-net
    restart: unless-stopped

  # ── OPA (Open Policy Agent) ───────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: hwcp-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-format=json"
      - "/policies"
    volumes:
      - ./packages/ai-policies/rego:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - hwcp-net
    restart: unless-stopped

  # ── Headscale (Self-hosted Tailscale Control Server) ─────────────────────────
  headscale:
    image: headscale/headscale:latest
    container_name: hwcp-headscale
    command: headscale serve
    volumes:
      - headscale_data:/var/lib/headscale
      - ./infra/headscale/config.yaml:/etc/headscale/config.yaml:ro
    ports:
      - "8080:8080"
    networks:
      - hwcp-net
    restart: unless-stopped

  # ── OpenTelemetry Collector ───────────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: hwcp-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9090:9090"   # Prometheus metrics
    networks:
      - hwcp-net
    restart: unless-stopped

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: hwcp-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - hwcp-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  headscale_data:
  grafana_data:

networks:
  hwcp-net:
    driver: bridge
